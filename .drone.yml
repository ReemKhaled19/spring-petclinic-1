kind: pipeline
type: docker
name: push-to-dockerhub

steps:
  - name: push-image
    image: plugins/docker
    settings:
      repo: mohamedelgarhy/spring-petclinic   # 👈 غيّر الاسم لو مختلف في Docker Hub
      username:
        from_secret: docker_username
      password:
        from_secret: docker_password
      tags:
        - latest
        - ${DRONE_BUILD_NUMBER}  # كل build ياخد رقم version مختلف

