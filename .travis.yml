language: java
jdk:
  - openjdk21

services:
  - docker

before_script:
  - echo "Starting Travis build for Spring Petclinic..."

script:
  - docker build -t spring-petclinic:build-latest .

after_success:
  - echo "Travis build completed successfully!"
  - curl -X POST https://192.168.157.128:8080/hook/<YOUR_WEBHOOK_TOKEN>
